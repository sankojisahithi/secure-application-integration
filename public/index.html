<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Application Integration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Secure Application Integration</h1>
        <p>Full Stack Developer Internship - Milestone 5</p>
    </header>

    <main>
        <section class="card">
            <h2>API Data</h2>
            <p id="status">Click below to load data.</p>
            <button id="loadDataBtn">Load API Data</button>
            <div id="apiData"></div>
        </section>

        <section class="card">
            <h2>Application Form</h2>

            <form id="applicationForm">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name"
                       required minlength="2" maxlength="80">

                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       required maxlength="254">

                <label for="message">Message</label>
                <textarea id="message" name="message"
                          required minlength="10" maxlength="1000"></textarea>

                <button type="submit">Submit Application</button>
            </form>

            <p id="formStatus" role="status"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
